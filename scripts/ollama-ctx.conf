# systemd drop-in for the Ollama service: make 128k contexts fit on the RTX 5090.
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp scripts/ollama-ctx.conf /etc/systemd/system/ollama.service.d/ctx.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
# Flash attention is required for a quantized KV cache; q8_0 halves KV memory vs f16 with
# negligible quality loss (q4_0 would quarter it, but hurts long-context recall).
[Service]
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
