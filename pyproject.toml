[project]
name = "pokemon-agent"
version = "0.1.0"
description = "Autonomous Pokemon Red player via PyBoy"
requires-python = ">=3.11"
dependencies = [
    "pyboy",
    "pillow",
    "numpy",
    "duckdb>=1.5.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "dlt[duckdb]>=1.0.0",
    "httpx>=0.27",
]
# Opt-in: only the machine driving a Daytona fan-out needs the SDK. It is not a
# default dependency, and the sandbox image does not install this group either —
# the SDK runs driver-side, not inside the arms.
fanout = [
    "daytona>=0.100.0",
]

[project.scripts]
viewer = "viewer.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests", "."]
filterwarnings = ["ignore::starlette.exceptions.StarletteDeprecationWarning"]
markers = ["rom: needs real ROMs under rom/ and several minutes of emulation"]

[tool.coverage.run]
source = ["scripts", "viewer"]
omit = ["scripts/diagnose.py", "scripts/install.sh", "scripts/observe_cli.py", "scripts/probe_*.py", "viewer/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# HTML/SVG generator: long markup lines are the content, not the code
"benchmarks/artifact/build_artifact.py" = ["E501"]
